name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    # read-only against the live production deployment: no secrets needed, nothing is written.
    # Vercel deploys main on push; wait until production serves this exact commit, then test it.
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://invoice-chaser-sigma.vercel.app
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Wait for production to serve this commit
        run: |
          for i in $(seq 1 60); do
            live=$(curl -fsS "$BASE_URL/api/version" | jq -r .commit || true)
            [ "$live" = "$GITHUB_SHA" ] && echo "production is on $live" && exit 0
            echo "production is on ${live:-unknown}, waiting for $GITHUB_SHA"; sleep 10
          done
          echo "production never served $GITHUB_SHA"; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium --project=mobile-android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  e2e-local:
    # PRs and branches: start the server from repository secrets (real Walrus Memory + Tatum, read-only tests)
    needs: checks
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      TATUM_API_KEY: ${{ secrets.TATUM_API_KEY }}
      MEMWAL_PRIVATE_KEY: ${{ secrets.MEMWAL_PRIVATE_KEY }}
      MEMWAL_ACCOUNT_ID: ${{ secrets.MEMWAL_ACCOUNT_ID }}
      MEMWAL_SERVER_URL: https://relayer.memory.walrus.xyz
      SUI_PAYEE_ADDRESS: ${{ secrets.SUI_PAYEE_ADDRESS }}
    steps:
      - name: Secrets present?
        id: secrets
        run: |
          if [ -n "$TATUM_API_KEY" ] && [ -n "$MEMWAL_PRIVATE_KEY" ] && [ -n "$MEMWAL_ACCOUNT_ID" ] && [ -n "$SUI_PAYEE_ADDRESS" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::E2E skipped: add TATUM_API_KEY, MEMWAL_PRIVATE_KEY, MEMWAL_ACCOUNT_ID and SUI_PAYEE_ADDRESS as repository secrets to run it on PRs"; fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: 24
          cache: npm
      - if: steps.secrets.outputs.ok == 'true'
        run: npm ci && npm run build && npx playwright install --with-deps chromium
      - if: steps.secrets.outputs.ok == 'true'
        run: npx playwright test --project=chromium --project=mobile-android
      - uses: actions/upload-artifact@v4
        if: always() && steps.secrets.outputs.ok == 'true'
        with:
          name: playwright-report-local
          path: playwright-report
          retention-days: 14
